name: refresh-data
# Daily data refresh: runs update_data.py, checks the output, commits data/*.json, then redeploys Pages.
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC Mon-Fri, after the US close (23:30/00:30 Israel time)
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to refresh (space separated, empty = all)"
        required: false
        default: ""
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore Yahoo info cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: yfinfo-${{ github.run_id }}
          restore-keys: yfinfo-
      - name: Update data
        run: python update_data.py ${{ github.event.inputs.markets }}
      - name: Check output (JSON valid, sizes, no private data)
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: python check_site.py --no-browser
      - id: commit
        name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0; fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
